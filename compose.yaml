# Server setup: put this file and env.example in one folder (e.g.
# /srv/stacks/tools/restash), copy env.example to .env and set
# RESTASH_PUBLIC_URL, and create the storage folder, owned by the user
# restash runs as:
#
#   mkdir -p storage/repos storage/trash
#   chown -R 65532:65532 storage
#
# On first start the log prints a link for making the admin account:
#
#   docker compose logs restash | grep signup
services:
  restash:
    image: ghcr.io/mcbulazs/restash:latest
    container_name: restash
    restart: unless-stopped
    # Settings: copy env.example to .env and edit it.
    env_file:
      - .env
    volumes:
      # Database, repos and trash. One mount, so deletes are plain renames.
      # The repos are served by restic's rest-server, built into restash.
      - ./storage:/storage
    read_only: true
    tmpfs:
      - /tmp:size=64m # SQLite's scratch space
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "/restash-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - traefik
      - monitoring # Prometheus scrapes restash:9464/metrics
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.restash.rule=Host(`restash.bulazs.com`)"
      - "traefik.http.routers.restash.entrypoints=websecure"
      - "traefik.http.services.restash.loadbalancer.server.port=8080"
      - "dashboard.name=restash"

networks:
  traefik:
    external: true
  monitoring:
    external: true
