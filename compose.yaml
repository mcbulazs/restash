# Server setup: put this file in one folder (e.g. /mnt/data/tools/restash)
# and create the storage folder, owned by the user restash runs as:
#
#   mkdir -p storage/repos storage/trash
#   chown -R 65532:65532 storage
#
# On first start the log prints a link for making the admin account:
#
#   docker compose logs restash | grep signup
services:
  restash:
    image: ghcr.io/mcbulazs/restash:latest
    container_name: restash
    restart: unless-stopped
    environment:
      RESTASH_PUBLIC_URL: https://restash.bulazs.com
      # Deleted backup files stay in storage/trash this many days.
      RESTASH_TRASH_DAYS: 30
      # restash's own ntfy alerts are off: the homelab dashboard alerts
      # on backups from the metrics below. To have restash alert each
      # person on their own topic instead, set an ntfy server here.
      # RESTASH_NTFY_SERVER: https://ntfy.sh
      # Prometheus metrics (per PC: online, last backup, size, problems).
      # Only reachable on the monitoring network, not through Traefik.
      RESTASH_METRICS_LISTEN: ":9464"
    volumes:
      # Database, repos and trash. One mount, so deletes are plain renames.
      # The repos are served by restic's rest-server, built into restash.
      - ./storage:/storage
    read_only: true
    tmpfs:
      - /tmp:size=64m # SQLite's scratch space
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 100
    healthcheck:
      test: ["CMD", "/restash-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - traefik
      - monitoring # Prometheus scrapes restash:9464/metrics
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.restash.rule=Host(`restash.bulazs.com`)"
      - "traefik.http.routers.restash.entrypoints=websecure"
      - "traefik.http.services.restash.loadbalancer.server.port=8080"
      - "dashboard.name=restash"

networks:
  traefik:
    external: true
  monitoring:
    external: true
